# Claude Code: official statically-linked installer that lands in
# ~/.local/bin and self-updates. Brew formula was used briefly, but
# native install gives direct control over update timing and matches
# the Kinoite path.

- name: claude-code | Install Claude Code
  ansible.builtin.shell: curl -fsSL https://claude.ai/install.sh | bash
  args:
    creates: "{{ lookup('env', 'HOME') }}/.local/bin/claude"

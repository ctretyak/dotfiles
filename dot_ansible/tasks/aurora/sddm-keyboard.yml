# Force English keyboard on the SDDM greeter regardless of the user's
# in-session layout. `/etc/X11/xorg.conf.d/00-keyboard.conf` is what the
# greeter's KWin reads for XKB on both X11 and Wayland; Plasma then
# applies per-user kxkbrc AFTER login, so this only affects the greeter.
# On atomic Aurora `/etc` is a regular writable filesystem (not part of
# the ostree overlay), so the file survives rpm-ostree upgrades.

- name: Force English layout on SDDM greeter
  ansible.builtin.copy:
    dest: /etc/X11/xorg.conf.d/00-keyboard.conf
    content: |
      Section "InputClass"
          Identifier "system-keyboard"
          MatchIsKeyboard "on"
          Option "XkbLayout" "us"
      EndSection
    owner: root
    group: root
    mode: "0644"
  become: true

# Aurora host layer via rpm-ostree — minimal.
#
# Aurora's base image already ships zsh, tmux, git (via git-credential-libsecret),
# gcc, distrobox, podman-docker, ptyxis, fastfetch, htop, glow, gum, just, kate,
# wl-clipboard and more. We only layer what's missing and not suitable for brew:
#
#   - zsh-syntax-highlighting / zsh-autosuggestions — system-sourced plugins
#     from /usr/share/zsh/site-functions, fit the system integration better
#     than brew equivalents
#   - gcc-c++ (g++) — needed by nvim-treesitter to build C++-scanner parsers
#     (yaml, typescript, tsx, prisma). Base ships gcc but not g++; brew's gcc
#     formula is huge and mismatches system headers
#
# Everything else (neovim, node, python, ripgrep, fd, fzf, lazygit, bc, jq)
# is installed via brew (brew-packages.yml).

- name: host-packages | Check currently layered packages
  ansible.builtin.command: rpm-ostree status --json
  register: ostree_status
  changed_when: false

- name: host-packages | Compute required host layers
  ansible.builtin.set_fact:
    required_layers:
      - zsh-syntax-highlighting
      - zsh-autosuggestions
      - gcc-c++

- name: host-packages | Determine missing layers
  ansible.builtin.set_fact:
    missing_layers: >-
      {{ required_layers
         | reject('in', (ostree_status.stdout | from_json).deployments[0].packages | default([]))
         | list }}

- name: host-packages | Layer missing host packages via rpm-ostree
  become: true
  ansible.builtin.command: >
    rpm-ostree install --idempotent --assumeyes {{ missing_layers | join(' ') }}
  when: missing_layers | length > 0
  register: rpm_ostree_install

- name: host-packages | Notify about staged deployment
  ansible.builtin.debug:
    msg: >
      Host packages layered into the next deployment: {{ missing_layers | join(', ') }}.
      The play continues — brew, flatpaks, and configs will install on the
      currently booted deployment. After this apply finishes, reboot once
      to activate the rpm-ostree layers (and any other layered tasks below
      such as Insync and VS Code).
  when: missing_layers | length > 0

# zsh ships in Aurora's base image (/usr/bin/zsh exists from day one), so
# changing the login shell does NOT depend on missing_layers. Read first
# to avoid a sudo prompt on every apply when the shell already matches.
- name: host-packages | Read current user record
  ansible.builtin.getent:
    database: passwd
    key: "{{ lookup('env', 'USER') }}"

- name: host-packages | Set zsh as default shell
  become: true
  ansible.builtin.user:
    name: "{{ lookup('env', 'USER') }}"
    shell: /usr/bin/zsh
  when: getent_passwd[lookup('env', 'USER')][5] != '/usr/bin/zsh'

- name: kwin-shortcuts | Configure KWin (Alt+Tab across all desktops, 6 virtual desktops)
  community.general.ini_file:
    path: "{{ lookup('env', 'HOME') }}/.config/kwinrc"
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    no_extra_spaces: true
    mode: "0644"
    create: true
  loop:
    - { section: TabBox,   option: DesktopMode, value: "0" }
    - { section: Desktops, option: Number,      value: "6" }
    - { section: Desktops, option: Rows,        value: "1" }
  register: kwinrc_changed

- name: kwin-shortcuts | Configure KWin global shortcuts (Meta+1..9 desktops)
  community.general.ini_file:
    path: "{{ lookup('env', 'HOME') }}/.config/kglobalshortcutsrc"
    section: kwin
    option: "{{ item.key }}"
    value: "{{ item.value }}"
    no_extra_spaces: true
    mode: "0600"
    create: true
  loop: "{{ kwin_shortcuts | dict2items }}"
  vars:
    kwin_shortcuts:
      "Switch to Desktop 1": "Meta+1,Ctrl+F1,Switch to Desktop 1"
      "Switch to Desktop 2": "Meta+2,Ctrl+F2,Switch to Desktop 2"
      "Switch to Desktop 3": "Meta+3,Ctrl+F3,Switch to Desktop 3"
      "Switch to Desktop 4": "Meta+4,Ctrl+F4,Switch to Desktop 4"
      "Switch to Desktop 5": "Meta+5,,Switch to Desktop 5"
      "Switch to Desktop 6": "Meta+6,,Switch to Desktop 6"
      "Switch to Desktop 7": "Meta+7,,Switch to Desktop 7"
      "Switch to Desktop 8": "Meta+8,,Switch to Desktop 8"
      "Switch to Desktop 9": "Meta+9,,Switch to Desktop 9"
      "Window to Desktop 1": "Meta+Shift+1,,Window to Desktop 1"
      "Window to Desktop 2": "Meta+Shift+2,,Window to Desktop 2"
      "Window to Desktop 3": "Meta+Shift+3,,Window to Desktop 3"
      "Window to Desktop 4": "Meta+Shift+4,,Window to Desktop 4"
      "Window to Desktop 5": "Meta+Shift+5,,Window to Desktop 5"
      "Window to Desktop 6": "Meta+Shift+6,,Window to Desktop 6"
      "Window to Desktop 7": "Meta+Shift+7,,Window to Desktop 7"
      "Window to Desktop 8": "Meta+Shift+8,,Window to Desktop 8"
      "Window to Desktop 9": "Meta+Shift+9,,Window to Desktop 9"
  register: kwin_shortcuts_changed

- name: kwin-shortcuts | Free Meta+1..9 from plasmashell taskbar entries
  community.general.ini_file:
    path: "{{ lookup('env', 'HOME') }}/.config/kglobalshortcutsrc"
    section: plasmashell
    option: "activate task manager entry {{ item }}"
    value: "none,Meta+{{ item }},Activate Task Manager Entry {{ item }}"
    no_extra_spaces: true
    mode: "0600"
    create: true
  loop: [1, 2, 3, 4, 5, 6, 7, 8, 9]
  register: plasmashell_shortcuts_changed

# Window actions. Format is `current,default,name` — keep upstream default in
# the default slot so KDE's "Reset to defaults" still restores Meta+PgUp.
- name: kwin-shortcuts | Configure KWin window action shortcuts
  community.general.ini_file:
    path: "{{ lookup('env', 'HOME') }}/.config/kglobalshortcutsrc"
    section: kwin
    option: "{{ item.key }}"
    value: "{{ item.value }}"
    no_extra_spaces: true
    mode: "0600"
    create: true
  loop: "{{ kwin_window_shortcuts | dict2items }}"
  vars:
    kwin_window_shortcuts:
      "Window Maximize": "Meta+M,Meta+PgUp,Maximize Window"
  register: kwin_window_shortcuts_changed

# kwinrc is reread at runtime via D-Bus reconfigure (covers TabBox + Desktops).
# kglobalshortcutsrc is NOT — KGlobalAccel components register their actions
# via doRegister at session startup only. KDE Plasma 6 exposes no D-Bus method
# to reload kglobalshortcutsrc; restarting plasma-kglobalaccel.service leaves
# it dead (Type=dbus, no client trigger after restart). The only reliable
# activation path is a Plasma session relogin.
- name: kwin-shortcuts | Reload KWin runtime config (kwinrc)
  ansible.builtin.command: dbus-send --session --type=method_call --dest=org.kde.KWin /KWin org.kde.KWin.reconfigure
  when: kwinrc_changed is changed
  changed_when: false

- name: kwin-shortcuts | Notify about relogin requirement for shortcut changes
  ansible.builtin.debug:
    msg: |
      Global shortcuts (kglobalshortcutsrc) were updated. KDE Plasma 6 has no
      runtime reload — log out of the Plasma session and back in to activate
      the new bindings. Both the kwin Meta+1..9 desktop bindings and the
      plasmashell rebinds that free those keys need this.
  when: kwin_shortcuts_changed is changed or plasmashell_shortcuts_changed is changed or kwin_window_shortcuts_changed is changed

- name: Configure KWin (Alt+Tab across all desktops, 6 virtual desktops)
  community.general.ini_file:
    path: "{{ lookup('env', 'HOME') }}/.config/kwinrc"
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    no_extra_spaces: true
    mode: "0644"
    create: true
  loop:
    - { section: TabBox,   option: DesktopMode, value: "0" }
    - { section: Desktops, option: Number,      value: "6" }
    - { section: Desktops, option: Rows,        value: "1" }
  register: kwinrc_changed

- name: Configure KWin global shortcuts (vim hjkl + Meta+1..9)
  community.general.ini_file:
    path: "{{ lookup('env', 'HOME') }}/.config/kglobalshortcutsrc"
    section: kwin
    option: "{{ item.key }}"
    value: "{{ item.value }}"
    no_extra_spaces: true
    mode: "0600"
    create: true
  loop: "{{ kwin_shortcuts | dict2items }}"
  vars:
    kwin_shortcuts:
      "Switch Window Left":     "Meta+H,Meta+Alt+Left,Switch to Window to the Left"
      "Switch Window Down":     "Meta+J,Meta+Alt+Down,Switch to Window Below"
      "Switch Window Up":       "Meta+K,Meta+Alt+Up,Switch to Window Above"
      "Switch Window Right":    "Meta+L,Meta+Alt+Right,Switch to Window to the Right"
      "Window Quick Tile Left":   "Meta+Shift+H,Meta+Left,Quick Tile Window to the Left"
      "Window Quick Tile Bottom": "Meta+Shift+J,Meta+Down,Quick Tile Window to the Bottom"
      "Window Quick Tile Top":    "Meta+Shift+K,Meta+Up,Quick Tile Window to the Top"
      "Window Quick Tile Right":  "Meta+Shift+L,Meta+Right,Quick Tile Window to the Right"
      "Switch to Desktop 1": "Meta+1,Ctrl+F1,Switch to Desktop 1"
      "Switch to Desktop 2": "Meta+2,Ctrl+F2,Switch to Desktop 2"
      "Switch to Desktop 3": "Meta+3,Ctrl+F3,Switch to Desktop 3"
      "Switch to Desktop 4": "Meta+4,Ctrl+F4,Switch to Desktop 4"
      "Switch to Desktop 5": "Meta+5,,Switch to Desktop 5"
      "Switch to Desktop 6": "Meta+6,,Switch to Desktop 6"
      "Switch to Desktop 7": "Meta+7,,Switch to Desktop 7"
      "Switch to Desktop 8": "Meta+8,,Switch to Desktop 8"
      "Switch to Desktop 9": "Meta+9,,Switch to Desktop 9"
      "Window to Desktop 1": "Meta+Shift+1,,Window to Desktop 1"
      "Window to Desktop 2": "Meta+Shift+2,,Window to Desktop 2"
      "Window to Desktop 3": "Meta+Shift+3,,Window to Desktop 3"
      "Window to Desktop 4": "Meta+Shift+4,,Window to Desktop 4"
      "Window to Desktop 5": "Meta+Shift+5,,Window to Desktop 5"
      "Window to Desktop 6": "Meta+Shift+6,,Window to Desktop 6"
      "Window to Desktop 7": "Meta+Shift+7,,Window to Desktop 7"
      "Window to Desktop 8": "Meta+Shift+8,,Window to Desktop 8"
      "Window to Desktop 9": "Meta+Shift+9,,Window to Desktop 9"
  register: kwin_shortcuts_changed

- name: Free Meta+1..9 from plasmashell taskbar entries
  community.general.ini_file:
    path: "{{ lookup('env', 'HOME') }}/.config/kglobalshortcutsrc"
    section: plasmashell
    option: "activate task manager entry {{ item }}"
    value: "none,Meta+{{ item }},Activate Task Manager Entry {{ item }}"
    no_extra_spaces: true
    mode: "0600"
    create: true
  loop: [1, 2, 3, 4, 5, 6, 7, 8, 9]
  register: plasmashell_shortcuts_changed

- name: Reload KWin
  ansible.builtin.command: dbus-send --session --type=method_call --dest=org.kde.KWin /KWin org.kde.KWin.reconfigure
  when: kwinrc_changed is changed or kwin_shortcuts_changed is changed
  changed_when: false

- name: Restart KDE global shortcuts daemon
  ansible.builtin.command: systemctl --user restart plasma-kglobalaccel.service
  when: kwin_shortcuts_changed is changed or plasmashell_shortcuts_changed is changed
  changed_when: false

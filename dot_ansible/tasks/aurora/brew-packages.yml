# Aurora ships Homebrew preinstalled at /home/linuxbrew/.linuxbrew.
# ublue's brew-upgrade.timer handles self-updates (OnBootSec=30min,
# OnUnitInactiveSec=8h) so we only need to ensure formulae are present.
#
# Dev stack via brew (Aurora-preferred over rpm-ostree):
#   - neovim, python@3.12       — editor + runtime
#   - ripgrep, fd, fzf, lazygit  — search / git TUI
#   - bc, jq                     — shell utilities
#
# wl-clipboard is NOT here — Aurora's base image already ships it
# (/usr/bin/wl-copy, /usr/bin/wl-paste) and Homebrew has no such formula.
#
# Compared to Kinoite's rpm-ostree list: gcc/gcc-c++/make stay on rpm-ostree
# (brew's gcc formula is huge; Fedora gcc is a small, well-integrated layer).

- name: Install dev stack via Homebrew
  community.general.homebrew:
    name:
      - neovim
      - python@3.12
      - ripgrep
      - fd
      - fzf
      - lazygit
      - bc
      - jq
    state: present
    path: /home/linuxbrew/.linuxbrew/bin

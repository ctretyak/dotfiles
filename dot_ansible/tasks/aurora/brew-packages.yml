# Aurora ships Homebrew preinstalled at /home/linuxbrew/.linuxbrew with
# /etc/profile.d/brew.sh adding it to interactive PATH. Updates run via
# `uupd.timer` (Universal blue update daemon) which on Aurora supplants
# rpm-ostreed-automatic / flatpak-system-update / brew-upgrade.timer and
# itself shells `brew upgrade` at the end — so we don't enable any brew
# timers ourselves.
#
# Dev stack via brew (Aurora-preferred over rpm-ostree):
#   - neovim, python@3.12       — editor + runtime
#   - ripgrep, fd, fzf, lazygit  — search / git TUI
#   - bc, jq                     — shell utilities
#   - rtk                        — token-reducing CLI proxy for Claude Code
#                                  (PreToolUse Bash hook in ~/.claude/settings.json)
#
# wl-clipboard is NOT here — Aurora's base image already ships it
# (/usr/bin/wl-copy, /usr/bin/wl-paste) and Homebrew has no such formula.
#
# Compared to Kinoite's rpm-ostree list: gcc/gcc-c++/make stay on rpm-ostree
# (brew's gcc formula is huge; Fedora gcc is a small, well-integrated layer).
#
# First provision takes 5–15 min while bottles for python@3.12 and neovim
# (perl, openssl, sqlite, mpdecimal, luajit, libuv, tree-sitter, …) install.
# Ansible buffers stdout — no live progress shown — so the task line will
# stay quiet until brew returns. This is an architectural limitation of
# ansible's connection layer (Popen + communicate), not a bug. Steady-state
# runs are fast (one `brew info` check, no network).

- name: brew-packages | Install dev stack via Homebrew
  community.general.homebrew:
    name:
      - neovim
      - python@3.12
      - ripgrep
      - fd
      - fzf
      - lazygit
      - bc
      - jq
      - rtk
    state: present
    path: /home/linuxbrew/.linuxbrew/bin

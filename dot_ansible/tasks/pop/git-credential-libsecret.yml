# Debian/Ubuntu ships git without the libsecret credential helper binary —
# only the source in git contrib/. Build it once so ~/.gitconfig's
# credential.helper path resolves.

- name: git-credential-libsecret | Check git-credential-libsecret is installed
  ansible.builtin.stat:
    path: /usr/lib/git-core/git-credential-libsecret
  register: libsecret_helper

- name: git-credential-libsecret | Install build deps for git-credential-libsecret
  become: true
  apt:
    name:
      - libsecret-1-dev
      - make
      - gcc
      - pkg-config
    state: present
  when: not libsecret_helper.stat.exists

- name: git-credential-libsecret | Build git-credential-libsecret
  become: true
  ansible.builtin.command: make
  args:
    chdir: /usr/share/doc/git/contrib/credential/libsecret
    creates: /usr/share/doc/git/contrib/credential/libsecret/git-credential-libsecret
  when: not libsecret_helper.stat.exists

- name: git-credential-libsecret | Install git-credential-libsecret into /usr/lib/git-core
  become: true
  ansible.builtin.copy:
    src: /usr/share/doc/git/contrib/credential/libsecret/git-credential-libsecret
    dest: /usr/lib/git-core/git-credential-libsecret
    mode: '0755'
    remote_src: true
  when: not libsecret_helper.stat.exists

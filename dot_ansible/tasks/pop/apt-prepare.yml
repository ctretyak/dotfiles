# Runs before any apt task. Fixes known conflicts that would break `apt update`.

# The `code` .deb postinst script drops /etc/apt/sources.list.d/vscode.sources
# pointing at /usr/share/keyrings/microsoft.gpg, which conflicts with our own
# vscode.list (signed-by /etc/apt/keyrings/packages.microsoft.asc) for the same URI.
- name: Opt out of Microsoft auto-adding its VS Code repo
  become: true
  ansible.builtin.debconf:
    name: code
    question: code/add-microsoft-repo
    vtype: boolean
    value: 'false'

- name: Remove Microsoft-managed vscode.sources if present
  become: true
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/vscode.sources
    state: absent

# --- Firewall (nftables) ---

- name: security | Install nftables
  become: true
  package:
    name: nftables
    state: present

- name: security | Configure nftables firewall
  become: true
  copy:
    content: |
      #!/usr/sbin/nft -f

      flush ruleset

      table inet filter {
        chain input {
          type filter hook input priority filter; policy drop;

          # loopback
          iif "lo" accept

          # established/related
          ct state established,related accept

          # drop invalid
          ct state invalid drop

          # ICMP/ICMPv6
          meta l4proto icmp accept
          meta l4proto ipv6-icmp accept

          # DHCPv6 client
          udp dport 546 accept
        }

        chain forward {
          type filter hook forward priority filter; policy drop;
        }

        chain output {
          type filter hook output priority filter; policy accept;
        }
      }
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
  register: nftables_config

- name: security | Enable nftables service
  become: true
  systemd:
    name: nftables
    enabled: true

- name: security | Start or restart nftables
  become: true
  systemd:
    name: nftables
    state: "{{ 'restarted' if nftables_config.changed else 'started' }}"

# --- Sysctl hardening ---

- name: security | Deploy sysctl hardening config
  become: true
  copy:
    content: |
      # Kernel hardening
      kernel.kptr_restrict = 2
      kernel.unprivileged_bpf_disabled = 1
      kernel.kexec_load_disabled = 1
      kernel.sysrq = 4
      kernel.perf_event_paranoid = 2
      kernel.yama.ptrace_scope = 1

      # Filesystem
      fs.protected_hardlinks = 1
      fs.protected_symlinks = 1
      fs.protected_fifos = 2
      fs.protected_regular = 2
      fs.suid_dumpable = 0

      # Network
      net.ipv4.conf.all.rp_filter = 1
      net.ipv4.conf.default.rp_filter = 1
      net.ipv4.conf.all.accept_redirects = 0
      net.ipv4.conf.default.accept_redirects = 0
      net.ipv6.conf.all.accept_redirects = 0
      net.ipv6.conf.default.accept_redirects = 0
      net.ipv4.conf.all.send_redirects = 0
      net.ipv4.conf.default.send_redirects = 0
      net.ipv4.conf.all.accept_source_route = 0
      net.ipv4.conf.default.accept_source_route = 0
      net.ipv6.conf.all.accept_source_route = 0
      net.ipv6.conf.default.accept_source_route = 0
      net.ipv4.tcp_syncookies = 1
      net.ipv4.tcp_rfc1337 = 1
    dest: /etc/sysctl.d/99-hardening.conf
    owner: root
    group: root
    mode: "0644"
  register: sysctl_config

- name: security | Apply sysctl settings
  become: true
  shell: sysctl --system
  when: sysctl_config.changed

# --- Mount hardening ---

- name: security | Harden /dev/shm mount options (noexec,nosuid,nodev)
  become: true
  mount:
    path: /dev/shm
    src: tmpfs
    fstype: tmpfs
    opts: defaults,nosuid,nodev,noexec
    state: mounted

# --- Core dumps ---

- name: security | Disable systemd core dump storage
  become: true
  copy:
    content: |
      [Coredump]
      Storage=none
      ProcessSizeMax=0
    dest: /etc/systemd/coredump.conf
    owner: root
    group: root
    mode: "0644"

- name: security | Ensure limits.d directory exists
  become: true
  file:
    path: /etc/security/limits.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: security | Disable core dumps via limits
  become: true
  copy:
    content: |
      * hard core 0
    dest: /etc/security/limits.d/10-coredump.conf
    owner: root
    group: root
    mode: "0644"

# --- Kernel module blacklist ---

- name: security | Deploy modprobe blacklist for unused kernel modules
  become: true
  copy:
    content: |
      # Uncommon network protocols
      install dccp /bin/true
      install sctp /bin/true
      install rds /bin/true
      install tipc /bin/true

      # Rare/legacy filesystems
      install cramfs /bin/true
      install freevxfs /bin/true
      install jffs2 /bin/true
      install hfs /bin/true
      install hfsplus /bin/true
    dest: /etc/modprobe.d/blacklist-unused.conf
    owner: root
    group: root
    mode: "0644"

# --- Faillock ---

- name: security | Set faillock deny to 6 attempts
  become: true
  lineinfile:
    path: /etc/security/faillock.conf
    regexp: '^#?\s*deny\s*='
    line: 'deny = 6'

# --- Secure Boot (sbctl) ---

- name: security | Install sbctl
  become: true
  package:
    name: sbctl
    state: present

- name: security | Check sbctl setup status
  become: true
  command: sbctl status --json
  register: sbctl_status
  changed_when: false

- name: security | Create Secure Boot keys
  become: true
  command: sbctl create-keys
  when: not (sbctl_status.stdout | from_json).installed

- name: security | Enroll Secure Boot keys (with Microsoft keys)
  become: true
  command: sbctl enroll-keys --microsoft
  when:
    - (sbctl_status.stdout | from_json).setup_mode
    - not (sbctl_status.stdout | from_json).secure_boot

- name: security | Find EFI binaries to sign
  become: true
  find:
    paths: /boot/EFI
    patterns: "*.efi,*.EFI"
    recurse: true
  register: efi_binaries

- name: security | Sign EFI binaries with sbctl
  become: true
  command: "sbctl sign -s {{ item.path }}"
  loop: "{{ efi_binaries.files }}"
  loop_control:
    label: "{{ item.path }}"
  register: sbctl_sign
  changed_when: "'already signed' not in sbctl_sign.stderr | default('')"
  failed_when:
    - sbctl_sign.rc != 0
    - "'already signed' not in sbctl_sign.stderr | default('')"

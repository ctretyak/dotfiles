- name: services | Install cronie
  become: true
  pacman:
    name: cronie

- name: services | Enable cronie service
  become: true
  systemd:
    name: cronie
    enabled: true
    state: started

- name: services | Check if Bluetooth adapter exists
  command: rfkill list bluetooth
  register: bluetooth_check
  changed_when: false
  failed_when: false

- name: services | Enable bluetooth service
  become: true
  systemd:
    name: bluetooth.service
    enabled: yes
    state: started
  when: bluetooth_check.rc == 0 and bluetooth_check.stdout | length > 0

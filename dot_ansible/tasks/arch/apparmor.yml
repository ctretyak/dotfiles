- name: Install AppArmor
  become: true
  package:
    name: apparmor
    state: present

- name: Enable AppArmor service
  become: true
  systemd:
    name: apparmor
    enabled: true
    state: started

- name: Add AppArmor LSM to kernel parameters
  become: true
  lineinfile:
    path: /etc/kernel/cmdline
    regexp: '^(.+)$'
    line: '\1 lsm=landlock,lockdown,yama,integrity,apparmor,bpf'
    backrefs: true
  when: "lookup('file', '/etc/kernel/cmdline') is not search('apparmor')"

- name: Check if UKI needs regeneration
  shell: grep -q 'apparmor' /proc/cmdline
  register: cmdline_check
  changed_when: false
  failed_when: false

- name: Regenerate UKI
  become: true
  command: mkinitcpio -P
  when: cmdline_check.rc != 0 and lookup('file', '/etc/kernel/cmdline') is search('apparmor')

- name: Reboot reminder
  debug:
    msg: "UKI regenerated. Reboot required to activate AppArmor."
  when: cmdline_check.rc != 0 and lookup('file', '/etc/kernel/cmdline') is search('apparmor')

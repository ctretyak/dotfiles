- name: iterm2 | Install iTerm2
  homebrew_cask:
    name: iterm2
    state: present

- name: iterm2 | Configure iTerm2 to load preferences from custom folder
  community.general.osx_defaults:
    domain: com.googlecode.iterm2
    key: "{{ item.key }}"
    type: "{{ item.type }}"
    value: "{{ item.value }}"
  loop:
    - { key: PrefsCustomFolder, type: string, value: "~/.config/iterm2" }
    - { key: LoadPrefsFromCustomFolder, type: bool, value: "true" }

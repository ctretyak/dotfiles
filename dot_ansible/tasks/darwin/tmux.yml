- name: tmux | Install tmux
  homebrew:
    update_homebrew: no
    name: tmux
    state: present

- name: tmux | Clone TPM
  git:
    repo: https://github.com/tmux-plugins/tpm
    dest: "{{ lookup('env', 'HOME') }}/.tmux/plugins/tpm"
    depth: 1

- name: tmux | Install tmux plugins
  command: "{{ lookup('env', 'HOME') }}/.tmux/plugins/tpm/bin/install_plugins"
  changed_when: false

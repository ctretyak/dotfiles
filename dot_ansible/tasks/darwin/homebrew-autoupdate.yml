- name: homebrew-autoupdate | Tap domt4/autoupdate
  community.general.homebrew_tap:
    name: domt4/autoupdate
    state: present

- name: homebrew-autoupdate | Check if brew autoupdate launchd agent is configured
  ansible.builtin.stat:
    path: "{{ lookup('env', 'HOME') }}/Library/LaunchAgents/com.github.domt4.homebrew-autoupdate.plist"
  register: autoupdate_plist

- name: homebrew-autoupdate | Start brew autoupdate (daily, with upgrade and cleanup, immediate on boot)
  ansible.builtin.command: /opt/homebrew/bin/brew autoupdate start 86400 --upgrade --cleanup --immediate
  when: not autoupdate_plist.stat.exists

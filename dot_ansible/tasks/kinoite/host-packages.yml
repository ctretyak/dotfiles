# Fedora Kinoite host layer via rpm-ostree.
#
# Everything dev-related lives on the host — shell, CLI, editor, dev runtimes.
# Plain Kinoite has no brew in base, so rpm-ostree is the natural choice.
# (Aurora — the ublue-os KDE remix — takes a different path: minimal layer
# plus brew; see tasks/aurora/ for that tree.)
#
# Distrobox was considered for language runtimes but the wrapper latency
# (~300-500ms per nvim/node invocation), broken /etc editing via sudoedit,
# and split-PATH "did I launch this from which shell" confusion weren't
# worth the /usr isolation. This machine is a developer workstation —
# compilers and node on /usr are normal, not pollution.
#
# Groups:
# - Shell: zsh + plugins, tmux
# - CLI tools: git, ripgrep, fd-find, fzf, lazygit, wl-clipboard, bc, jq
# - Editor: neovim (Mason/treesitter will find node/gcc natively)
# - Dev runtimes: nodejs, npm, python3-pip, gcc, make, gcc-c++

- name: Check currently layered packages
  ansible.builtin.command: rpm-ostree status --json
  register: ostree_status
  changed_when: false

- name: Compute required host layers
  ansible.builtin.set_fact:
    required_layers:
      # Shell
      - zsh
      - zsh-syntax-highlighting
      - zsh-autosuggestions
      - tmux
      # CLI utilities
      - bc
      - jq
      - git
      - ripgrep
      - fd-find
      - fzf
      - lazygit
      - wl-clipboard
      # Editor + dev runtimes
      - neovim
      - nodejs
      - npm
      - python3-pip
      - gcc
      - gcc-c++
      - make

- name: Determine missing layers
  ansible.builtin.set_fact:
    missing_layers: >-
      {{ required_layers
         | reject('in', (ostree_status.stdout | from_json).deployments[0].packages | default([]))
         | list }}

- name: Layer missing host packages via rpm-ostree
  become: true
  ansible.builtin.command: >
    rpm-ostree install --idempotent --assumeyes {{ missing_layers | join(' ') }}
  when: missing_layers | length > 0
  register: rpm_ostree_install

- name: Notify about staged deployment
  ansible.builtin.debug:
    msg: >
      Host packages layered into the next deployment: {{ missing_layers | join(', ') }}.
      Reboot to activate them. Re-run 'chezmoi apply' after reboot to continue.
  when: missing_layers | length > 0

- name: Set zsh as default shell (requires zsh layered first)
  become: true
  ansible.builtin.user:
    name: "{{ lookup('env', 'USER') }}"
    shell: /usr/bin/zsh
  when: missing_layers | length == 0

# VS Code via Microsoft's official yum repo, layered through rpm-ostree.
#
# Flatpak sandbox breaks VS Code dev workflow in annoying ways:
# - terminal doesn't inherit host shell environment cleanly
# - Remote-SSH / Remote-Containers extensions need extra portal wiring
# - debug adapters struggle with port forwarding
# - podman/docker from the integrated terminal is extra complicated
#
# Microsoft officially supports the RPM repo, so we use that.
#
# We don't import the GPG key via rpm_key: /usr/share/rpm is read-only on
# rpm-ostree systems, so rpm --import fails. Instead the repo file points
# at gpgkey=URL and rpm-ostree fetches/trusts it automatically on install.

# Check rpm-ostree state first so a fully installed layer short-circuits
# both the yum repo add and the install — no sudo prompt on steady-state.
- name: vscode | Check currently layered packages
  ansible.builtin.command: rpm-ostree status --json
  register: ostree_status_vscode
  changed_when: false

- name: vscode | Determine whether VS Code is already layered
  ansible.builtin.set_fact:
    vscode_layered: "{{ 'code' in ((ostree_status_vscode.stdout | from_json).deployments[0].packages | default([])) }}"

- name: vscode | Add Microsoft VS Code yum repo
  become: true
  ansible.builtin.yum_repository:
    name: vscode
    description: Visual Studio Code
    baseurl: https://packages.microsoft.com/yumrepos/vscode
    gpgcheck: true
    gpgkey: https://packages.microsoft.com/keys/microsoft.asc
    enabled: true
  when: not vscode_layered

- name: vscode | Layer VS Code
  become: true
  ansible.builtin.command: rpm-ostree install --idempotent --assumeyes code
  when: not vscode_layered
  register: vscode_layer

- name: vscode | Notify if VS Code needs a reboot to activate
  ansible.builtin.debug:
    msg: "VS Code layered into next deployment. Reboot to activate."
  when: vscode_layer is changed

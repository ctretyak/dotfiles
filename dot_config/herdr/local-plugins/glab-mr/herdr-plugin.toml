id = "glab-mr"
name = "GitLab MR"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Show the GitLab MR number of a worktree branch as the $mr sidebar token"
platforms = ["linux", "macos"]

[[startup]]
command = ["bash", "mr.sh"]

[[events]]
on = "worktree.created"
command = ["bash", "mr.sh"]

[[events]]
on = "worktree.opened"
command = ["bash", "mr.sh"]

# MR usually appears after the worktree is created, so refresh on focus too.
[[events]]
on = "workspace.focused"
command = ["bash", "mr.sh"]

[[actions]]
id = "refresh"
title = "Refresh MR numbers"
contexts = ["global"]
command = ["bash", "mr.sh", "all"]

[[actions]]
id = "open"
title = "Open MR in browser"
contexts = ["global"]
command = ["bash", "mr.sh", "open"]
platforms = ["macos"]

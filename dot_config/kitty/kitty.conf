# Window
hide_window_decorations yes
window_padding_width    0
placement_strategy      center
background_opacity      0.99
confirm_os_window_close 0
remember_window_size    yes

# Font
font_family       JetBrainsMono Nerd Font
bold_font         auto
italic_font       auto
font_size         11.0
disable_ligatures cursor
modify_font       cell_height 105%

# Scrollback
scrollback_lines                10000
scrollback_pager_history_size   100

# Bell
enable_audio_bell    no
visual_bell_duration 0.1
window_alert_on_bell yes

# Tab bar
tab_bar_edge         top
tab_bar_style        powerline
tab_powerline_style  slanted
tab_title_template   "{index}: {title}"
active_tab_font_style bold

# Shell integration (enabled by default since 0.24, явно для ясности)
shell_integration enabled

# Keymaps
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+f     launch --type=overlay --stdin-source=@screen_scrollback fzf
map ctrl+shift+h     kitten hints --type hyperlink

# BEGIN_KITTY_THEME
# Rosé Pine
include current-theme.conf
# END_KITTY_THEME

# Cursor (override theme)
cursor                #e0def4
cursor_text_color     #191724
cursor_blink_interval 0
